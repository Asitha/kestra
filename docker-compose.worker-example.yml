volumes:
  postgres-data:
    driver: local
  kestra-storage:
    driver: local

services:
  postgres:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    ports:
      - "5432:5432"

  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
      args:
        APT_PACKAGES: "python3 python-is-python3 python3-pip curl"
        PYTHON_LIBRARIES: "kestra"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - kestra-storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        # Optional: Install additional APT packages
        APT_PACKAGES: "python3 python-is-python3 python3-pip curl"
        # Optional: Install Python libraries
        PYTHON_LIBRARIES: "kestra"
        # Optional: Install Kestra plugins
        # KESTRA_PLUGINS: "io.kestra.plugin.aws io.kestra.plugin.gcp"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
    # Override default command to set custom thread count
    # command: ["server", "worker", "--thread", "128"]
    # Set worker group (EE only)
    # command: ["server", "worker", "--worker-group", "my-worker-group"]
    depends_on:
      postgres:
        condition: service_healthy
      executor:
        condition: service_started
    restart: unless-stopped
    volumes:
      - kestra-storage:/app/storage

# Note: This example shows executor + worker components.
# For a complete distributed setup, you would also need:
# - scheduler (using Dockerfile.scheduler) - schedules workflows based on triggers
# - webserver (using Dockerfile.webserver) - provides UI and API
