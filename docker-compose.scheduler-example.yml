volumes:
  postgres-data:
    driver: local
  kestra-storage:
    driver: local

services:
  postgres:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    ports:
      - "5432:5432"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
      args:
        APT_PACKAGES: "python3 python-is-python3 python3-pip curl"
        PYTHON_LIBRARIES: "kestra"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - kestra-storage:/app/storage

  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
      args:
        APT_PACKAGES: "python3 python-is-python3 python3-pip curl"
        PYTHON_LIBRARIES: "kestra"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_started
    restart: unless-stopped
    volumes:
      - kestra-storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        APT_PACKAGES: "python3 python-is-python3 python3-pip curl"
        PYTHON_LIBRARIES: "kestra"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      executor:
        condition: service_started
    restart: unless-stopped
    volumes:
      - kestra-storage:/app/storage

# Note: This example shows scheduler + executor + worker components.
# For a complete distributed setup with UI, you would also need:
# - webserver (using Dockerfile.webserver) - provides UI and API
